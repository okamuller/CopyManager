name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CopyManager.sln

      - name: Build
        run: dotnet build CopyManager.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/CopyManager.Tests/CopyManager.Tests.csproj --configuration Release --no-build --verbosity normal
